<section class="auth-card">
  <h2 class="auth-title">Welcome Back</h2>
  <p class="auth-subtitle">Login to your ResumeFlow account</p>

  <form (ngSubmit)="onLogin()">
    <fieldset>
      <label for="email">Email</label>
      <input id="email" name="email" [(ngModel)]="email" placeholder="you@example.com" />
    </fieldset>

    <fieldset>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" [(ngModel)]="password" placeholder="Your password" />
    </fieldset>

    <button type="submit" class="auth-btn">Login</button>

    @if (error) {
      <p class="error-msg">{{ error }}</p>
    }
  </form>

  <p class="auth-footer">Don't have an account? <a routerLink="/signup">Sign up</a></p>
</section>
