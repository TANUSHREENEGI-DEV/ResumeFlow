<nav class="navbar">
  <section class="navbar-left">
    <span class="logo">RESUMEFLOW</span>
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a routerLink="/documents" routerLinkActive="active" class="nav-link">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      Documents
    </a>
    <a routerLink="/templates" routerLinkActive="active" class="nav-link">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      Templates
    </a>
    <a routerLink="/applications" routerLinkActive="active" class="nav-link">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      Applications
    </a>
    <a routerLink="/shares" routerLinkActive="active" class="nav-link">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      Shared links
    </a>
  </section>

  <section class="navbar-right">
    <button class="avatar-trigger" (click)="toggleMenu()">
      <span class="avatar-circle">{{ getInitials() }}</span>
      <span class="user-name">{{ userName() }}</span>
      <span class="chevron">▾</span>
    </button>

    @if (menuOpen()) {
      <ul class="avatar-dropdown">
        <li><a routerLink="/profile" (click)="closeMenu()">Profile</a></li>
        <li><a routerLink="/change-password" (click)="closeMenu()">Change password</a></li>
        <li class="divider"></li>
        <li><button (click)="logout()">Sign out</button></li>
      </ul>
    }
  </section>

  <button class="hamburger-btn" (click)="toggleMobileMenu()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
</nav>

@if (mobileMenuOpen()) {
  <ul class="mobile-menu">
    <li><a routerLink="/dashboard" routerLinkActive="active" (click)="closeMobileMenu()">Dashboard</a></li>
    <li><a routerLink="/documents" routerLinkActive="active" (click)="closeMobileMenu()">Documents</a></li>
    <li><a routerLink="/templates" routerLinkActive="active" (click)="closeMobileMenu()">Templates</a></li>
    <li><a routerLink="/applications" routerLinkActive="active" (click)="closeMobileMenu()">Applications</a></li>
    <li><a routerLink="/shares" routerLinkActive="active" (click)="closeMobileMenu()">Shared links</a></li>
    <li class="divider"></li>
    <li><a routerLink="/profile" (click)="closeMobileMenu()">Profile</a></li>
    <li><button (click)="logout()">Sign out</button></li>
  </ul>
}
